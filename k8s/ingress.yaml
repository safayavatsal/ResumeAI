apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumeai-ingress
  annotations:
    kubernetes.io/ingress.class: "gce" # Use GCE ingress for GKE
spec:
  rules:
  - host: frontend.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: backend.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4292
